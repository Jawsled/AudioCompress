[project]
name = "audiocompress"
version = "0.2.0"
description = "Compress high-bitrate audio to Opus/Ogg while preserving cover art quality"
requires-python = ">=3.10"
dependencies = [
  "mutagen>=1.48.1",
  "Pillow>=12.3.0",
  "typer>=0.27.2",
  "rich>=15.0.0",
  "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.8"]

[project.scripts]
audiocompress = "audiocompress.cli:app"
audiocompress-gui = "audiocompress.gui_qt:main"
audiocompress-gui-tk = "audiocompress.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
